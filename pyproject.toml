[project]
name = "patient-trial-matching"
version = "0.1.0"
description = "Patient–trial matching for biomarker-stratified oncology, with honest evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Chiu-Feng (Steph) Yap" },
]

dependencies = [
    # HTTP & data
    "httpx>=0.27",
    "tenacity>=8.5",           # retry decorator for API calls
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyarrow>=16",             # parquet
    "pandas>=2.2",
    "numpy>=1.26",

    # Embeddings & vector store
    "sentence-transformers>=3.0",
    "chromadb>=0.5",

    # LLM SDKs
    "anthropic>=0.40",         # paid frontier baseline
    "google-genai>=0.3",       # free-tier baseline

    # Notebook & viz
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",

    # Utilities
    "tqdm>=4.66",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
